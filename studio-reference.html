<!doctype html><meta charset="utf-8"><title>Studio geometry references</title><style>body{margin:0;background:#18231d;color:#eee;font:16px system-ui}header{padding:12px}button,a{padding:10px;margin:4px;display:inline-block}iframe{width:100%;height:62vh;border:0}img{max-width:100%}body.has-capture iframe{position:absolute;left:-10000px;width:1280px;height:720px}</style><header><b>Studio geometry reference — provisional roof and openings</b><p>Saved studio base retained. Boundary views use neutral fill light for inspection. Street widths are photo estimates; full Unreal presentation details are not included.</p><button id="front">Drive-facing view</button><button id="wide">Garden context view</button><button id="inside">Interior layout view</button><button id="boundary">Front boundary review</button><button id="detail">Wall detail</button><button id="angle">Wall angled view</button><span id="status">Loading…</span><a id="download" hidden>Download original image</a></header><iframe id="house" src="house.html?site=house-wip&version=approved_2b&garden=1&mode=review&capture=1"></iframe><img id="result" alt="Original studio reference render"><script type="module">
import * as THREE from './assets/vendor/three/build/three.module.js';
const frame=document.querySelector('#house'),status=document.querySelector('#status'),result=document.querySelector('#result'),download=document.querySelector('#download');
function shot(name){const h=frame.contentWindow.__house;if(!h?.captureState?.().ready){status.textContent='House still loading — try again shortly';return;}h.garden?.leave();let fill=h.scene.getObjectByName('Boundary review fill');if(!fill){fill=new THREE.HemisphereLight(0xdce9ff,0xada28a,1.4);fill.name='Boundary review fill';h.scene.add(fill);}fill.visible=['boundary','detail','angle'].includes(name);h.scene?.traverse(o=>{if(o.name==='Marks')o.visible=false;if(o.name==='Studio hipped roof')o.visible=name!=='inside';});const p=name==='angle'?{x:12.4,z:28.7,y:-.239,eye:2.6,yawDeg:55,pitchDeg:-8,fov:65}:name==='detail'?{x:7.3,z:26.6,y:-.239,eye:1.8,yawDeg:0,pitchDeg:-8,fov:48}:name==='boundary'?{x:4.8,z:30.3,y:-.239,eye:2.4,yawDeg:0,pitchDeg:-7,fov:65}:name==='inside'?{x:6.8,z:22,y:-.139,eye:9,yawDeg:45,pitchDeg:-62,fov:48}:name==='front'?{x:9,z:21,y:-.139,eye:2.7,yawDeg:65,pitchDeg:-7,fov:58}:{x:12,z:25,y:-.139,eye:6,yawDeg:36,pitchDeg:-17,fov:64};const r=h.captureAt({...p,w:1920,h:1080,quality:1,post:false});result.src=r.url;document.body.classList.add('has-capture');download.href=r.url;download.download='studio-'+name+'-original.jpg';download.hidden=false;status.textContent='Original model render — '+name;}
document.querySelector('#front').onclick=()=>shot('front');document.querySelector('#wide').onclick=()=>shot('wide');document.querySelector('#inside').onclick=()=>shot('inside');document.querySelector('#boundary').onclick=()=>shot('boundary');document.querySelector('#detail').onclick=()=>shot('detail');document.querySelector('#angle').onclick=()=>shot('angle');
const timer=setInterval(()=>{if(frame.contentWindow.__house?.captureState?.().ready){status.textContent='Ready';clearInterval(timer);if(location.hash==='#boundary')shot('boundary')}},1000);
</script>
