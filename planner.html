<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room Planner</title>
<meta name="description" content="23 Battle Road: review and edit the signed-off design spec room by room. Edits go to a change list; Send to build makes the next spec version.">
<style>
  :root {
    --bg: #f3f1ec; --paper: #fbfaf7; --panel: #ffffff; --ink: #23251f; --ink-2: #5d6058; --ink-3: #8b8e85; --line: #e1ded5; --line-2: #cfcbc0;
    --accent: #2f6f62; --accent-ink: #ffffff; --accent-soft: #dcebe6; --warn: #b26b12; --warn-soft: #fbecd6; --bad: #b4382b; --good: #2f7a3f;
    --wall: #3a3a36; --wall-n: #b9b5aa; --plan-bg: #f8f6f1; --room-stroke: #c9c4b8; --item-line: #4b4d46; --sel: #2f6fd0;
    --shadow: 0 1px 2px rgba(30, 28, 20, .06), 0 6px 24px rgba(30, 28, 20, .07);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    --r: 12px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161816; --paper: #1d201d; --panel: #222622; --ink: #ebece6; --ink-2: #b2b5ab; --ink-3: #82867d; --line: #343833; --line-2: #464b44;
      --accent: #7cc3b2; --accent-ink: #0d1714; --accent-soft: #24352f; --warn: #e3a557; --warn-soft: #3a2c19; --bad: #ef7b6c; --good: #83c58f;
      --wall: #d9d8d0; --wall-n: #5a5d57; --plan-bg: #1b1e1b; --room-stroke: #4b4f48; --item-line: #c9cbc2; --sel: #7fb0ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161816; --paper: #1d201d; --panel: #222622; --ink: #ebece6; --ink-2: #b2b5ab; --ink-3: #82867d; --line: #343833; --line-2: #464b44;
    --accent: #7cc3b2; --accent-ink: #0d1714; --accent-soft: #24352f; --warn: #e3a557; --warn-soft: #3a2c19; --bad: #ef7b6c; --good: #83c58f;
    --wall: #d9d8d0; --wall-n: #5a5d57; --plan-bg: #1b1e1b; --room-stroke: #4b4f48; --item-line: #c9cbc2; --sel: #7fb0ff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  [hidden] { display: none !important; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line-2); background: var(--panel); border-radius: 9px; padding: 7px 12px; min-height: 36px; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; }
  button.ghost:hover { background: var(--accent-soft); }
  button.danger { color: var(--bad); }
  button.icon { padding: 6px; min-width: 36px; display: inline-grid; place-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; padding: 2px; background: var(--paper); gap: 2px; }
  .seg button { border: 0; background: transparent; min-height: 30px; padding: 4px 11px; border-radius: 8px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  input[type="text"], input[type="search"], textarea, select { background: var(--paper); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  svg.ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- layout ---------- */
  #app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
  #top { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); background: var(--paper); flex-wrap: wrap; }
  #top .brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: 6px; }
  #top .brand b { font-size: 15px; letter-spacing: -.01em; }
  #top .brand span { font-size: 11.5px; color: var(--ink-3); }
  #top .spacer { flex: 1; }
  #conn { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  #conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  #conn.server i { background: var(--good); } #conn.device i { background: var(--warn); }
  .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 700; margin-left: 6px; }
  .count.zero { background: var(--line-2); color: var(--ink-2); }
  #banner { grid-column: 1 / -1; }
  .banner { margin: 8px 16px 0; padding: 9px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: 13px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }

  #main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; position: relative; }
  #main.with3d { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 380px; }
  #planPane, #threePane { position: relative; min-width: 0; min-height: 0; background: var(--plan-bg); }
  #threePane { border-left: 1px solid var(--line); background: linear-gradient(var(--paper), var(--plan-bg)); }
  #threePane canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  #plan { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; color: var(--item-line); }
  .pane-tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 2; max-width: calc(100% - 24px); }
  .pane-tools .card { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 11px; padding: 4px; display: flex; gap: 4px; align-items: center; box-shadow: var(--shadow); }
  .pane-tools .card button { min-height: 34px; }
  #roomTitle { font-weight: 650; padding: 0 8px; font-size: 14px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 5px 9px; border-radius: 8px; pointer-events: none; }
  .three-label { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 5px 9px; border-radius: 8px; z-index: 2; }
  .three-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); text-align: center; padding: 24px; }

  #inspector { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h2 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; line-height: 1.25; }
  .sec h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0 0 9px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .sec h3 .grow { flex: 1; }
  .muted { color: var(--ink-2); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; color: var(--ink-3); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--ink-2); }
  .chip.ok { color: var(--good); } .chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; } .chip.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  dl.kv { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; margin: 0; font-size: 13px; }
  dl.kv dt { color: var(--ink-3); } dl.kv dd { margin: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row.tight { gap: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; min-height: 0; position: relative; }
  .sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border-radius: 10px; border: 2px solid var(--accent); }
  .sw-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sw-row .lab { width: 78px; font-size: 12.5px; color: var(--ink-2); }
  input[type="color"] { width: 30px; height: 30px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0; background: none; cursor: pointer; }
  .warns { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .warns li { background: var(--warn-soft); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .list { display: grid; gap: 2px; }
  #inspector { overflow-x: hidden; }
  #inspector .seg, .modal .seg { flex-wrap: wrap; }
  #inspector .seg button { padding: 4px 9px; }
  .opt > span { min-width: 0; }
  .opt { white-space: normal; }
  .opt .tag { max-width: 92px; }
  .opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 9px; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; min-height: 48px; }
  .opt:hover { background: var(--paper); border-color: var(--line); }
  .opt.current { background: var(--accent-soft); }
  .opt .ic { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(0,0,0,.1); }
  .opt .nm { font-size: 13.5px; line-height: 1.25; }
  .opt .sub { font-size: 11.5px; color: var(--ink-3); }
  .opt .tag { font-size: 11px; color: var(--ink-3); text-align: right; }
  .opt.nofit { opacity: .55; }
  details > summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 6px 0; }
  .note { background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; }
  .note .tiny { display: block; margin-top: 3px; }
  .items-list .opt { grid-template-columns: 30px minmax(0, 1fr) auto; min-height: 40px; padding: 5px 8px; }
  .num { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 13px; background: var(--paper); border: 1px solid var(--line-2); font-size: 11.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .num.warn { border-color: var(--warn); color: var(--warn); }
  .rooms-list .opt { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .dot { width: 12px; height: 12px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .actions button { padding: 6px 4px; font-size: 12.5px; }
  .kbd { font-size: 11px; color: var(--ink-3); }

  /* ---------- plan drawing ---------- */
  #plan .room { fill: color-mix(in srgb, var(--floor) 26%, var(--plan-bg)); stroke: none; cursor: pointer; transition: fill .15s; }
  #plan .room.hover { fill: color-mix(in srgb, var(--floor) 42%, var(--plan-bg)); }
  #plan .room.dim { fill: color-mix(in srgb, var(--floor) 10%, var(--plan-bg)); }
  #plan .room.focus { cursor: default; fill: color-mix(in srgb, var(--floor) 30%, var(--plan-bg)); }
  #plan .band { fill: none; stroke-opacity: .9; vector-effect: non-scaling-stroke; stroke-linejoin: miter; pointer-events: none; }
  #plan .wall { fill: var(--wall); pointer-events: none; }
  #plan .wall.neighbour { fill: var(--wall-n); }
  #plan .fixture { fill: color-mix(in srgb, var(--wall) 55%, var(--plan-bg)); pointer-events: none; }
  #plan .stair { fill: var(--plan-bg); stroke: var(--item-line); stroke-width: 0.8; vector-effect: non-scaling-stroke; pointer-events: none; }
  #plan .stair.upper { stroke-dasharray: 3 3; fill: none; opacity: .6; }
  #plan .stair-arrow { stroke: var(--item-line); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
  #plan .win-frame { fill: var(--plan-bg); stroke: var(--wall); stroke-width: .9; vector-effect: non-scaling-stroke; }
  #plan .win-glass { stroke: var(--wall); stroke-width: .7; vector-effect: non-scaling-stroke; }
  #plan .jamb { stroke: var(--wall); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  #plan .leaf { stroke: var(--wall); stroke-width: 1.8; vector-effect: non-scaling-stroke; fill: none; }
  #plan .leaf.bifold { stroke-width: 1.3; }
  #plan .swing { fill: none; stroke: var(--wall); stroke-width: .8; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; opacity: .75; pointer-events: none; }
  #plan .swing.derived { stroke: var(--warn); }
  #plan .it { --c: #ccc; }
  #plan .it .body, #plan .it .hit { fill: color-mix(in srgb, var(--c) 62%, var(--plan-bg)); stroke: var(--item-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  #plan .it .hit { fill: transparent; stroke: none; }
  #plan .it .body.dark { fill: color-mix(in srgb, var(--c) 40%, #222); }
  #plan .it .body.thin { stroke-width: 1.2; }
  #plan .it .line-in { fill: none; stroke: var(--item-line); stroke-width: .7; vector-effect: non-scaling-stroke; opacity: .7; }
  #plan .it .line-in.dark { fill: color-mix(in srgb, var(--c) 40%, var(--item-line)); }
  #plan .it .front-line { stroke: var(--item-line); stroke-width: 2; vector-effect: non-scaling-stroke; }
  #plan .it .rug { fill: color-mix(in srgb, var(--c) 45%, var(--plan-bg)); stroke: var(--item-line); stroke-width: .7; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; }
  #plan .it .rug-in { fill: none; stroke: var(--item-line); stroke-width: .5; opacity: .35; vector-effect: non-scaling-stroke; }
  #plan .it .soft { fill: color-mix(in srgb, var(--c) 75%, var(--plan-bg)); stroke: var(--item-line); stroke-width: .6; vector-effect: non-scaling-stroke; opacity: .9; pointer-events: none; }
  #plan .it.sh-throw .soft { opacity: .35; stroke-dasharray: 2 2; }  /* throws drape: select them by their number */
  #plan .it .ceiling { fill: transparent; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; pointer-events: visibleStroke; }
  #plan .it .ceiling-x { stroke: var(--accent); stroke-width: .8; vector-effect: non-scaling-stroke; }
  #plan .it .plant { fill: color-mix(in srgb, #6c8b58 55%, var(--plan-bg)); stroke: #4f6b40; stroke-width: .9; vector-effect: non-scaling-stroke; }
  #plan .it .plant-in { stroke: #4f6b40; stroke-width: .6; vector-effect: non-scaling-stroke; }
  #plan .it .curtain { fill: none; stroke: color-mix(in srgb, var(--c) 55%, var(--item-line)); stroke-width: 2.2; vector-effect: non-scaling-stroke; }
  #plan .it.other { opacity: .38; pointer-events: none; }
  #plan .it.mine { cursor: grab; }
  #plan .it.mine:active { cursor: grabbing; }
  #plan .it.warn .body, #plan .it.warn .rug { stroke: var(--warn); stroke-width: 2; }
  #plan .it.selected .body, #plan .it.selected .rug, #plan .it.selected .soft { stroke: var(--sel); stroke-width: 2.2; }
  #plan .it.blocked :is(.body,.rug,.soft,.front-line,.curtain,.ceiling,.plant) { fill:#cb423855; stroke:#bc302c; stroke-width:2.8; }
  .kit-filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
  .kit-filters label { font-size:12px; color:var(--ink-2); }
  .kit-results { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .kit-tile { display:flex; flex-direction:column; align-items:flex-start; text-align:left; padding:8px; }
  .kit-tile img { width:100%; aspect-ratio:1.25; object-fit:contain; border-radius:5px; background:#edece7; }
  .kit-tile small { color:var(--ink-2); }
  .planner-walk { display:inline-block; margin-top:9px; color:var(--accent); }
  @media (max-width:450px) { .kit-filters {gap:4px;} .kit-filters select { padding:6px 2px; } .kit-results {grid-template-columns:repeat(2,minmax(0,1fr));} }
  #plan .badge circle { fill: var(--panel); stroke: var(--item-line); stroke-width: .9; vector-effect: non-scaling-stroke; }
  #plan .badge text { text-anchor: middle; font-weight: 700; fill: var(--ink); font-family: var(--font); font-variant-numeric: tabular-nums; pointer-events: none; }
  #plan .badge.s circle { fill: var(--paper); }
  #plan .badge.added circle { stroke: var(--accent); stroke-width: 1.6; }
  #plan .badge.swapped circle { stroke: var(--accent); stroke-dasharray: 2 1.5; stroke-width: 1.6; }
  #plan .badge.warn circle { stroke: var(--warn); stroke-width: 1.8; }
  #plan .badge .warn-dot { fill: var(--warn); stroke: var(--panel); }
  #plan .badge.selected circle { fill: var(--sel); stroke: var(--sel); }
  #plan .badge.selected text { fill: #fff; }
  #plan .badge { cursor: pointer; }
  #plan .rl { text-anchor: middle; font-weight: 650; fill: var(--ink); font-family: var(--font); pointer-events: none; paint-order: stroke; stroke: var(--plan-bg); stroke-linejoin: round; }  /* stroke width is set in world units by plan.js */
  #plan .rl.dim { fill: var(--ink-3); font-weight: 500; }
  #plan .ra { text-anchor: middle; fill: var(--ink-2); font-family: var(--font); pointer-events: none; paint-order: stroke; stroke: var(--plan-bg); }
  #plan .guide { stroke: var(--sel); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .75; }
  #plan .guide.wall { stroke: var(--accent); opacity: 1; }
  #plan .sel-box { fill: none; stroke: var(--sel); stroke-width: 1.2; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  #plan .rot-stem { stroke: var(--sel); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  #plan .rot-handle { fill: var(--panel); stroke: var(--sel); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: grab; }
  #plan .front-edge { stroke: var(--sel); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  #plan .stair-arrow { marker-end: url(#arrow); }

  /* ---------- dialogs ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20, 20, 16, .38); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal .box { background: var(--panel); border-radius: 16px; width: min(720px, 100%); max-height: min(86dvh, 900px); display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; }
  .modal header, .modal footer { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .modal footer { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; }
  .modal header h2 { margin: 0; font-size: 17px; flex: 1; }
  .modal .body { overflow-y: auto; padding: 12px 18px; }
  .change { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .change .tiny { grid-column: 1 / -1; }
  .change.undone { opacity: .5; text-decoration: line-through; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

  /* ---------- narrow screens: inspector becomes a bottom sheet, 3D shares the plan's space ---------- */
  @media (max-width: 1100px) { #main.with3d { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 1fr; } #main.with3d #inspector { position: absolute; right: 0; top: 0; bottom: 0; width: 360px; box-shadow: var(--shadow); z-index: 5; } #main.with3d.nosel #inspector { display: none; } }
  @media (max-width: 760px) {
    #top { gap: 6px; padding-left: 12px; padding-right: 12px; }
    #top .brand, .wide-only { display: none !important; }
    #top { row-gap: 6px; }
    #top .spacer { display: none; }
    #zoomIn, #zoomOut, #themeBtn { display: none; }
    .pane-tools { gap: 4px; left: 8px; top: 8px; }
    .pane-tools .card button { min-height: 32px; padding: 4px 8px; }
    #inspector, #main.with3d #inspector { max-height: 42dvh; }
    #threeBtn[aria-pressed="true"] { background: var(--accent-soft); }
    #main, #main.with3d { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    #main.with3d { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; }
    #threePane { border-left: 0; border-top: 1px solid var(--line); }
    #inspector, #main.with3d #inspector { position: relative; width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 46dvh; box-shadow: 0 -6px 20px rgba(0,0,0,.08); z-index: 5; display: block; }
    #inspector.collapsed { max-height: 64px; overflow: hidden; }
    .sheet-grip { display: flex !important; }
    .pane-hint { display: none; }
    #roomTitle { max-width: 34vw; }
  }
  .sheet-grip { display: none; justify-content: center; padding: 6px 0 0; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .sheet-grip button { width: 56px; min-height: 18px; height: 18px; padding: 0; border-radius: 9px; background: var(--line-2); border: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="module" src="src/editor-help.js"></script>

<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>Room planner</b><span>23 Battle Road · spec v1 (signed off 1 Nov)</span></div>
    <div class="seg" id="verSeg" role="group" aria-label="Version">
      <button data-v="before" aria-pressed="false" title="The house today">Before</button>
      <button data-v="after" aria-pressed="true" title="The approved scheme, finished">After</button>
    </div>
    <div class="seg" id="storeySeg" role="group" aria-label="Floor">
      <button data-s="ground" aria-pressed="true">Ground</button>
      <button data-s="first" aria-pressed="false">First</button>
    </div>
    <div class="spacer"></div>
    <span id="conn" title="" role="status"><i></i><span>Connecting…</span></span>
    <button type="button" id="saveLayout" title="Save furniture and finishes to this house version">Save layout</button>
    <button type="button" id="reloadLayout" hidden>Discard local draft</button>
    <button class="icon ghost" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="icon ghost" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button type="button" data-editor-help="planner">How to use</button>
    <button id="changesBtn" title="Everything you have changed and not sent yet"><span class="wide-only">Changes</span><span class="count zero" id="changeCount">0</span></button>
    <button class="primary" id="sendBtn" title="Make these changes the next spec version (one rebuild)">Send<span class="wide-only"> to build</span></button>
    <button class="icon ghost" id="themeBtn" title="Light / dark" aria-label="Switch light or dark"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </header>
  <div id="main" class="nosel">
    <section id="planPane">
      <svg id="plan" aria-label="Floor plan">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
      </svg>
      <div class="pane-tools">
        <div class="card" id="roomCard" hidden>
          <button class="ghost" id="backBtn" title="Back to the whole floor (Esc)"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Floor</button>
          <span id="roomTitle"></span>
        </div>
        <div class="card">
          <button class="icon ghost" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="icon ghost" id="zoomFit" title="Fit" aria-label="Fit to screen"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="icon ghost" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
        </div>
        <div class="card" id="roomTools" hidden>
          <button class="ghost" id="snapBtn" aria-pressed="true" title="Snap to the 50 mm grid, walls and other pieces (hold Shift or Alt to move freely)">Snap on</button>
          <button class="ghost" id="addBtn" title="Add a piece from the catalogue">+ Add</button>
        </div>
        <div class="card"><button class="ghost" id="plannerLights" aria-pressed="false">House lights off</button><button class="ghost" id="threeBtn" aria-pressed="false" title="Loads a simple 3D view of the room (nothing 3D loads until you press this)"><span class="wide-only">Show </span>3D<span class="wide-only"> preview</span></button></div>
      </div>
      <div class="pane-hint" id="hint">Tap a room to open it</div>
    </section>
    <section id="threePane" hidden>
      <div class="three-label">Room preview · drag to orbit · tap a piece to inspect</div>
      <div class="three-empty" id="threeEmpty">Open a room to see it in 3D.</div>
    </section>
    <aside id="inspector" aria-label="Details"></aside>
  </div>
</div>

{
  "imports": {
    "three": "./assets/vendor/three/build/three.module.js",
    "three/addons/": "./assets/vendor/three/examples/jsm/"

}
